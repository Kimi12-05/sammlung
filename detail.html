<!DOCTYPE html>
<html lang="de">
<head>

            <a href="models.html" class="back-btn">←</a>
            <h1 id="modelName">Model</h1>

            <div class="profile-card">

                <div class="profile-info">
                    <div class="info-row">

                    <div class="info-row">

                    <div class="info-row">

                </div>

            <div class="link-section">

            </div>
        </div>
        
        <div class="tabbar">
            <a href="index.html" class="tab-item">
                <div class="tab-icon">⌂</div>
                <div class="tab-label">Start</div>
            </a>
            <a href="seiten.html" class="tab-item">
                <div class="tab-icon">🌐</div>
                <div class="tab-label">Seiten</div>
            </a>
            <a href="models.html" class="tab-item active">
                <div class="tab-icon">👤</div>
                <div class="tab-label">Models</div>
            </a>
            <a href="kategorien.html" class="tab-item">

            </a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
